<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YEAR 2 LEARNING EVENT — Registrations</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
      :root {
        --ink: #211712;
        --ink-soft: #6b5a4e;
        --paper: #ffffff;
        --panel: #ffffff;
        --border: #e8dccb;
        --header-bg: #fffefc;
        --accent: #fa9411;
        --accent-dark: #e27f0d;
        --accent-soft: #fde9cf;
        --good: #1f1a16;
        --good-soft: #ede8e1;
        --bad: #e12900;
        --bad-soft: #fce0d6;
        --muted: #948b80;
        font-family:
          -apple-system, BlinkMacSystemFont, "Inter", Roboto, Helvetica, Arial,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      body {
        background: var(--paper);
        color: var(--ink);
      }

      .wrap {
        max-width: 1400px;
        margin: 0 auto;
        padding: 28px 32px;
      }

      .header {
        background: var(--panel);
        border: 1px solid var(--border);
        border-top: 3px solid var(--accent);
        border-radius: 16px;
        padding: 22px 26px;
        margin-bottom: 18px;
      }
      .header-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        flex-wrap: wrap;
      }

      .event-brand {
        display: flex;
        align-items: center;
        margin-bottom: 16px;
        width: 180px;
        height: 50px;
      }

      .event-logo {
        display: block;
        width: 180px;
        height: 50px;
        object-fit: contain;
      }

      .title-input {
        font-size: 20px;
        font-weight: 700;
        border: none;
        background: transparent;
        color: var(--ink);
        padding: 2px 0;
        width: 100%;
        max-width: 440px;
        letter-spacing: -0.01em;
      }

      .title-input:focus {
        outline: none;
        border-bottom: 1px solid var(--accent);
      }

      .date-input {
        border: none;
        background: transparent;
        color: var(--ink-soft);
        font-size: 13px;
        margin-top: 4px;
        padding: 2px 0;
      }
      .date-input:focus {
        outline: none;
        border-bottom: 1px solid var(--accent);
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .btn {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--ink);
        padding: 9px 14px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn:hover {
        border-color: var(--ink-soft);
      }
      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--accent-dark);
        border-color: var(--accent-dark);
      }
      .btn-primary:disabled {
        background: var(--muted);
        border-color: var(--muted);
        cursor: not-allowed;
      }
      .btn-danger {
        color: var(--bad);
        border-color: var(--bad-soft);
      }

      .btn-danger:hover {
        background: var(--bad-soft);
      }

      .capacity-row {
        margin-top: 18px;
      }
      .capacity-label {
        display: flex;
        justify-content: space-between;
        font-size: 12.5px;
        color: var(--ink-soft);
        margin-bottom: 6px;
      }

      .capacity-track {
        height: 8px;
        background: var(--header-bg);
        border-radius: 6px;
        overflow: hidden;
      }
      .capacity-fill {
        height: 100%;
        background: var(--accent);
        transition: width 0.3s ease;
      }

      .capacity-fill.full {
        background: var(--bad);
      }
      .banner {
        margin-bottom: 16px;
        padding: 11px 16px;
        border-radius: 10px;
        font-size: 13.5px;
        font-weight: 600;
      }

      .banner-warn {
        background: var(--bad-soft);
        color: var(--bad);
      }

      .banner-info {
        background: var(--accent-soft);
        color: var(--accent-dark);
      }

      .stats {
        display: flex;
        gap: 14px;
        margin-bottom: 16px;
        flex-wrap: wrap;
        color: rgb(212, 18, 4);
      }

      .stat {
        background: var(--header-bg);
        border: 1px solid var(--border);
        border-top: 3px solid purple;
        border-radius: 12px;
        padding: 14px 18px;
        min-width: 150px;
        flex: 1;
        box-shadow: 5px 5px 6px 4px rgba(175, 175, 153, 0.322);
      }

      .stat.stat-total {
        border-top-color: #e12900;
      }

      .stat.stat-in {
        border-top-color: #1f1a16;
      }
      .stat.stat-out {
        border-top-color: #fa9411;
      }

      .stat-label {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .stat-value {
        font-size: 24px;
        font-weight: 700;
      }
      .stat-value.good {
        color: var(--good);
      }
      .stat-value.bad {
        color: var(--bad);
      }
      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }

      .search-wrap {
        position: relative;
        flex: 1;
        max-width: 1500px;
        min-width: 200px;
      }

      .search {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 40px 10px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 13.5px;
        background: var(--header-bg);
      }

      .search:focus {
        outline: none;
        border-color: var(--accent);
        background: var(--panel);
      }

      .search-clear {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        color: var(--muted);
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
        padding: 0;
      }

      .search-clear:hover {
        background: var(--accent-soft);
        color: var(--ink);
      }

      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        padding: 9px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--header-bg);
        color: var(--ink-soft);
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
      }

      .chip.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      
      .row {
          width: 100%;
          background: var(--panel);
          border: 1px solid var(--border);
          border-radius: 14px;
          padding: 16px 18px;
      }
      
    
      .row-top {
         display: flex;
         align-items: flex-start;
         justify-content: space-between;
         gap: 20px;
         width: 100%;
      }

      .row-name {
        font-size: 16px;
        font-weight: 700;
      }
      .row-meta {
        font-size: 12.5px;
        color: var(--ink-soft);
        margin-top: 3px;
      }

      .row-meta span + span::before {
        content: " · ";
        color: var(--muted);
      }
      .attendee-info {
        flex: 1;
        min-width: 0;
      }

      .attendee-details {
        display: grid;
        grid-template-columns: 1fr 1.5fr 1fr 1.4fr 0.9fr;
        gap: 20px;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--header-bg);
      }

      .detail-item {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }

      .detail-label {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: black;
      }

      .detail-value {
        font-size: 11px;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .attendance-info {
        display: flex;
        gap: 18px;
        margin-top: 12px;
        font-size: 12px;
        color: var(--ink-soft);
      }

      .attendance-info span + span::before {
        content: " · ";
        color: var(--muted);
        margin-right: 8px;
      }

      .signature-badge {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }

      .signature-badge.signed {
        background: #c4fcde;
        color: #1b6b4a;
      }

      .signature-badge.not-signed {
        background: var(--header-bg);
        color: var(--muted);
        border: 1px solid var(--border);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 11px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      .badge.in {
        background: #c4fcde;
        color: #000000;
      }

      .badge.out {
        background: var(--bad-soft);
        color: var(--bad);
      }
      .badge-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }
      .badge.in .badge-dot {
        background: #58c597;
      }

      .badge.out .badge-dot {
        background: var(--bad);
      }

      .row-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
      }

      .row-btn {
        border: 1px solid var(--border);
        background: var(--header-bg);
        padding: 7px 13px;
        border-radius: 9px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        color: var(--ink);
      }

      .row-btn.state-out {
        background: #fa9411;
        border-color: #ffbc6e;
        color: #141413;
      }

      .row-btn.state-out:hover {
        background: #ffad4d;
      }

      .row-btn.state-in {
        background: #ff9595;
        border-radius: 12px;
        color: #1c1d1d;
      }

      .row-btn.state-in:hover {
        background: #fa6d6d;
      }

      .row-btn.delete {
        color: var(--bad);
      }

      .row-btn.delete:hover {
        background: var(--bad-soft);
      }

      .empty {
        text-align: center;
        padding: 60px 20px;
        color: var(--muted);
      }
      .empty-title {
        font-size: 14.5px;
        font-weight: 700;
        color: var(--ink-soft);
        margin-bottom: 4px;
      }

      #signout-btn{
        background: #ff9595;
      }
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(33, 23, 18, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 16px;
        overflow-y: auto;
        box-sizing: border-box;
      }

      .modal {
        background: var(--panel);
        border-radius: 16px;
        padding: 22px;
        width: 100%;
        max-width: 420px;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        box-sizing: border-box;
      }

      .modal.wide {
        max-width: 560px;
      }
      .modal h3 {
        margin-top: 0;
      }

      .modal-actions {
        position: sticky;
        bottom: 0;
        background: var(--panel);
        padding-top: 12px;
      }

      .modal p.sub {
        margin: 0 0 18px 0;
        color: var(--muted);
        font-size: 12.5px;
      }

      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: var(--ink-soft);
        margin-bottom: 5px;
      }

      .field input,
      .field textarea,
      .field select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 9px;
        font-size: 13.5px;
        background: var(--header-bg);
        color: var(--ink);
      }

      .field textarea {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        min-height: 140px;
        resize: vertical;
      }
      .field input:focus,
      .field textarea:focus,
      .field select:focus {
        outline: none;
        border-color: var(--accent);
        background: #fff;
      }
      .optional {
        color: var(--muted);
        font-weight: 400;
        font-size: 12px;
      }

      .form-alert {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: 0 0 16px 0;
        padding: 11px 12px;
        border: 1px solid #f2b7a7;
        border-left: 4px solid var(--bad);
        border-radius: 10px;
        background: var(--bad-soft);
        color: var(--bad);
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.45;
      }

      .form-alert-icon {
        flex: 0 0 20px;
        width: 20px;
        height: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--bad);
        color: #fff;
        font-size: 12px;
        font-weight: 800;
      }

      .form-section-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--accent-dark);
        margin: 20px 0 10px 0;
        padding-top: 14px;
        border-top: 1px solid var(--header-bg);
      }

      .form-section-title:first-of-type {
        margin-top: 4px;
        padding-top: 0;
        border-top: none;
      }

      .field-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .field-full {
        grid-column: 1 / -1;
      }

      .field input:read-only {
        background: #f1eee8;
        color: var(--ink-soft);
      }

      .bank-search-wrap {
        position: relative;
      }

      .bank-search-wrap label {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .bank-search-wrap label::after {
        content: "Search to find your bank";
        font-size: 10px;
        font-weight: 500;
        color: var(--muted);
        text-transform: none;
        letter-spacing: 0;
      }

      .bank-dropdown {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(100% + 8px);
        z-index: 100;
        max-height: 230px;
        overflow-y: auto;
        padding: 6px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 12px 28px rgba(33, 23, 18, 0.18);
      }

      .bank-option {
        padding: 11px 12px;
        min-height: 42px;
        display: flex;
        align-items: center;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }

      .bank-option:hover {
        background: var(--accent-soft);
        color: var(--accent-dark);
      }

      #f-bank-search {
        padding-right: 38px;
        background: #fff;
        border-color: var(--border);
        box-shadow: inset 0 0 0 1px rgba(250, 148, 17, 0.03);
      }

      #f-bank-search:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(250, 148, 17, 0.12);
      }

      .bank-details-card {
        background: linear-gradient(180deg, #fffdf9 0%, #fff 100%);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        margin-top: 2px;
      }

      .bank-details-card .field {
        margin-bottom: 12px;
      }

      .bank-details-card .field:last-child {
        margin-bottom: 0;
      }

      .bank-account-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .bank-status {
        min-height: 18px;
        margin-top: 2px;
        padding: 7px 9px;
        border-radius: 8px;
        background: var(--header-bg);
      }

      .bank-status.verifying {
        color: var(--accent-dark);
      }
      .bank-status.verified {
        color: #0e3d2a;
        font-weight: 700;
      }
      .bank-status.error {
        color: var(--bad);
      }

      .file-drop {
        border: 2px dashed var(--border);
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        font-size: 13px;
        color: var(--ink-soft);
        margin-bottom: 14px;
        background: var(--header-bg);
        cursor: pointer;
      }
      .file-drop:hover {
        border-color: var(--accent);
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
      }

      .import-summary {
        background: var(--good-soft);
        color: var(--good);
        border-radius: 9px;
        padding: 11px 14px;
        font-size: 13px;
        margin-top: 12px;
      }

      .import-summary.issues {
        background: var(--accent-soft);
        color: var(--accent-dark);
      }
      .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 18px;
      }

      .error-text {
        color: var(--bad);
        font-size: 12px;
        margin-top: 10px;
      }

      .loading {
        padding: 60px;
        text-align: center;
        color: var(--muted);
      }

      /* Tablets / small laptops */
      @media (max-width: 900px) {
        .wrap {
          padding: 20px;
        }

        .header {
          padding: 20px;
        }

        .header-top {
          gap: 14px;
        }

        .title-input {
          font-size: 28px;
          max-width: 100%;
        }

        .actions {
          width: 100%;
        }

        .field-grid {
          grid-template-columns: 1fr 1fr;
        }

        .attendee-details {
          grid-template-columns: 1fr 1.5fr 1fr;
          gap: 14px;
        }

        .row-top {
          gap: 10px;
        }

        .modal.wide {
          max-width: 680px;
        }
      }

      @media (max-width: 600px) {
        html,
        body {
          width: 100%;
          max-width: 100%;
          overflow-x: hidden;
        }

        html {
          min-height: 100%;
        }

        body {
          min-height: 100%;
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;
        }
 
        .wrap {
          width: 100%;
          padding: 12px;
        }

        .header {
          padding: 16px;
          border-radius: 13px;
          margin-bottom: 14px;
        }

        .header-top {
          display: flex;
          flex-direction: column;
          align-items: stretch;
          gap: 14px;
        }
      .event-brand {
        display: flex;
        align-items: center;
        margin-bottom: 16px;
        width: 180px;
        height:50px;
      }

      .event-logo {
        display: block;
        width: 180px;
        height: 50px;
        object-fit: contain;
      }
        .title-input {
          width: 100%;
          max-width: 100%;
          font-size: 19px;
          line-height: 1.25;
        }

        .date-input {
          width: 100%;
          font-size: 12px;
        }

        .actions {
          display: grid;
          grid-template-columns: 1fr 1fr;
          width: 100%;
          gap: 8px;
        }

        .actions .btn {
          width: 100%;
          justify-content: center;
          min-height: 42px;
          padding: 9px 10px;
        }

        .actions .btn-primary {
          grid-column: 1 / -1;
        }
        #add-btn {
          width: auto !important;
          min-height: 40px !important;
          padding: 8px 12px !important;
          grid-column: auto !important;
        }

        .capacity-row {
          margin-top: 16px;
        }

        .capacity-label {
          font-size: 11.5px;
        }

        .banner {
          margin-bottom: 12px;
          padding: 10px 12px;
          font-size: 12.5px;
        }

        .stats {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 8px;
          margin-bottom: 12px;
        }

        .stat {
          min-width: 0;
          padding: 12px;
        }

        .stat:first-child {
          grid-column: 1 / -1;
        }

        .stat-label {
          font-size: 10.5px;
        }

        .stat-value {
          font-size: 21px;
        }

        .controls {
          display: flex;
          flex-direction: column;
          gap: 9px;
          margin-bottom: 12px;
        }

        .search {
          width: 100%;
          min-width: 0;
          max-width: none;
          padding: 11px 12px;
          font-size: 14px;
        }

        .chips {
          width: 100%;
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          gap: 6px;
        }

        .chip {
          width: 100%;
          padding: 9px 5px;
          font-size: 11px;
          text-align: center;
        }

        .list {
          gap: 8px;
        }

        .row {
          width: 100%;
          padding: 14px;
          border-radius: 12px;
        }

        .row-top {
          display: flex;
          flex-direction: row;
          align-items: flex-start;
          justify-content: space-between;
          gap: 10px;
          width: 100%;
        }

        .attendee-info {
          flex: 1;
          min-width: 0;
        }
        .badge {
          flex-shrink: 0;
          white-space: nowrap;
        }

        .row-actions {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 8px;
          width: 100%;
          margin-top: 12px;
        }
        .row-actions .row-btn {
          width: 100%;
          min-width: 0;
        }

        .row-name {

          font-size: 11.5px;
        }

        .attendee-details {
          display: grid;
          grid-template-columns: 105px 190px 90px 150px 105px;
          gap: 14px;
          width: max-content;
          min-width: 100%;
          margin-top: 12px;
          padding-top: 10px;
          overflow: visible;
        }

        .attendee-details-scroll {
          width: 100%;
          overflow-x: auto;
          overflow-y: hidden;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: thin;
        }

        .attendee-details-scroll::-webkit-scrollbar {
          height: 6px;
        }

        .detail-item {
          min-width: 0;
        }

        .detail-label {
          font-size: 9.5px;
        }

        .detail-value {
          max-width: 180px;
          font-size: 11.5px;
        }

        .attendance-info {
          flex-wrap: wrap;
          gap: 6px 12px;
          font-size: 11px;
        }

        
        .modal-overlay {
          position: fixed;
          inset: 0;
          padding: 12px;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          box-sizing: border-box;
        }

        .modal,
        .modal.wide {
          width: 100%;
          max-width: 620px;
          height: calc(100dvh - 24px);
          max-height: calc(100dvh - 24px);
          margin: auto;
          padding: 18px 16px;
          border-radius: 16px;
          overflow-y: auto;
          overflow-x: hidden;
          -webkit-overflow-scrolling: touch;
          overscroll-behavior: contain;
          box-sizing: border-box;
        }

        .modal h3 {
          font-size: 17px;
        }

        .modal p.sub {
          font-size: 12px;
          margin-bottom: 15px;
        }

        .form-section-title {
          font-size: 10.5px;
          margin-top: 17px;
          margin-bottom: 9px;
        }

        .field-grid {
          grid-template-columns: 1fr;
          gap: 0;
        }

        .field-full {
          grid-column: auto;
        }

        .field {
          width: 100%;
          margin-bottom: 12px;
        }

        .field label {
          font-size: 11.5px;
        }

        .field input,
        .field textarea,
        .field select {
          width: 100%;
          min-height: 44px;
          padding: 10px 11px;
          font-size: 16px;
        }

        .field textarea {
          min-height: 100px;
        }

        .bank-dropdown {
          max-height: 200px;
          overflow-y: auto;
          bottom: calc(100% + 7px);
        }

        .bank-option {
          padding: 11px 12px;
          min-height: 42px;
        }

        .bank-details-card {
          padding: 12px;
          border-radius: 12px;
        }

        .bank-account-row {
          grid-template-columns: 1fr;
          gap: 0;
        }

        .bank-search-wrap label::after {
          display: none;
        }

        .modal-actions {
          display: flex;
          gap: 10px;
          justify-content: flex-end;
          margin-top: 18px;
          position: sticky;
          bottom: 0;
          background: var(--panel);
          padding-top: 12px;
          z-index: 5;
        }

        .modal-actions .btn {
          width: 100%;
          min-height: 44px;
          justify-content: center;
        }
        #sign-overlay .modal-actions {
          display: grid;
          grid-template-columns: auto auto minmax(0, 1fr);
          gap: 8px;
          align-items: center;
        }

        #sign-overlay .modal-actions .btn {
          width: auto;
          min-height: 40px;
          padding: 8px 11px;
          font-size: 12px;
          white-space: nowrap;
        }

        #sign-overlay #sign-confirm {
          width: 100%;
        }

        #import-overlay .modal,
        #sign-overlay .modal {
          max-height: 92vh;
        }

        .file-drop {
          padding: 18px 12px;
        }

        #signature-canvas {
          width: 100% !important;
          height: auto !important;
          min-height: 150px;
          touch-action: none;
        }

        .empty {
          padding: 45px 15px;
        }
      }

      /* very small phones */
      @media (max-width: 380px) {
        #sign-overlay .modal-actions {
          grid-template-columns: 1fr 1fr;
        }

        #sign-overlay #sign-confirm {
          grid-column: 1 / -1;
        }

        #sign-overlay .modal-actions .btn {
          width: 100%;
        }

        .wrap {
          padding: 9px;
        }

        .header {
          padding: 13px;
        }

        .title-input {
          font-size: 21px;
        }

        .actions {
          grid-template-columns: 1fr;
        }

        .actions .btn-primary {
          grid-column: auto;
        }

        .stats {
          grid-template-columns: 1fr;
        }

        .stat:first-child {
          grid-column: auto;
        }

        .chips {
          grid-template-columns: 1fr;
        }

        .row-actions {
          grid-template-columns: 1fr;
        }

        .modal,
        .modal.wide {
          padding: 16px 13px;
        }

        .modal-actions {
          grid-template-columns: 1fr;
        }

        function formatTime(iso) {
          if (!iso) return "";
          try {
            return new Date(iso).toLocaleTimeString([], {
              hour: "numeric",
              minute: "2-digit",
            });
          } catch (e) {
            return "";
          }
        }

        async function apiFetch(path, opts = {}) {
          const res = await fetch(`${API_BASE}${path}`, {
            ...opts,
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
              ...(opts.headers || {}),
            },
          });
          if (res.status === 401) {
            localStorage.removeItem("staff_token");
            window.location.href = "/login.html";
            throw new Error("Unauthorized");
          }
          return res;
        }

        async function loadMeta() {
          try {
            const res = await apiFetch("/staff/meta");
            if (res.ok)
              state.meta = Object.assign({}, state.meta, await res.json());
          } catch (e) {
            console.error(e);
          }
        }

        async function loadAttendees() {
          try {
            const params = new URLSearchParams();
            if (state.search.trim()) params.set("search", state.search.trim());
            if (state.filter === "in") params.set("checkedIn", "true");
            if (state.filter === "out") params.set("checkedIn", "false");
            const res = await apiFetch(`/staff/attendees?${params.toString()}`);
            if (res.ok) {
              const data = await res.json();
              state.items = data.items || [];
              state.stats = data.stats || state.stats;
            }
          } catch (e) {
            console.error(e);
          }
        }

        async function saveMeta() {
          try {
            await apiFetch("/staff/meta", {
              method: "PUT",
              body: JSON.stringify(state.meta),
            });

            console.error(e);
          }
        }

        function setupSignaturePad() {
          const canvas = document.getElementById("signature-canvas");
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          ctx.lineWidth = 2.5;
          ctx.lineCap = "round";
          ctx.strokeStyle = "#211712";
          let drawing = false;
          let hasDrawn = false;
          const confirmBtn = document.getElementById("sign-confirm");

          function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
              x: (e.clientX - rect.left) * (canvas.width / rect.width),
              y: (e.clientY - rect.top) * (canvas.height / rect.height),
            };
          }
          function start(e) {
            drawing = true;
            const p = getPos(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            e.preventDefault();
          }
          function move(e) {
            if (!drawing) return;
            const p = getPos(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            if (!hasDrawn) {
              hasDrawn = true;
              if (confirmBtn) confirmBtn.disabled = false;
            }
            e.preventDefault();
          }
          function stop() {
            drawing = false;
          }

          canvas.addEventListener("pointerdown", start);
          canvas.addEventListener("pointermove", move);
          window.addEventListener("pointerup", stop);

          const clearBtn = document.getElementById("sign-clear");
          if (clearBtn)
            clearBtn.addEventListener("click", () => {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              hasDrawn = false;
              if (confirmBtn) confirmBtn.disabled = true;
            });

          const cancelBtn = document.getElementById("sign-cancel");
          if (cancelBtn)
            cancelBtn.addEventListener("click", () => {
              state.signAttendeeId = null;
              state.signError = "";
              render();
            });

          if (confirmBtn)
            confirmBtn.addEventListener("click", async () => {
              if (!hasDrawn) return;
              const dataUrl = canvas.toDataURL("image/png");
              confirmBtn.disabled = true;
              confirmBtn.textContent = "Checking in…";
              try {
                const res = await apiFetch(
                  `/staff/attendees/${state.signAttendeeId}`,
                  {
                    method: "PATCH",
                    body: JSON.stringify({
                      checkedIn: true,
                      signatureData: dataUrl,
                    }),
                  },
                );
                const data = await res.json();
                if (!res.ok) {
                  state.signError = data.error || "Something went wrong.";
                  render();
                  return;
                }
                state.signAttendeeId = null;
                state.signError = "";
                await loadAttendees();
                render();
              } catch (e) {
                state.signError = "Network error — please try again.";
                render();
              }
            });
        }

        function parsePastedText(text) {
          const lines = text.split(/\r?\n/).filter((line) => line.trim());

          if (!lines.length) return [];

          // Excel copy/paste normally uses TABs
          const separator = lines[0].includes("\t") ? "\t" : ",";

          function splitLine(line) {
            return line.split(separator).map((value) =>
              String(value || "")
                .trim()
                .replace(/^"|"$/g, ""),
            );
          }

          function normalizeHeader(header) {
            return String(header || "")
              .toLowerCase()
              .replace(/[\s_\-\/]+/g, "")
              .replace(/[()]/g, "");
          }

          const aliases = {
            name: ["name", "fullname", "attendeename", "participantname"],
            phone: [
              "phone",
              "phonenumber",
              "mobile",
              "mobilenumber",
              "telephone",
              "contact",
              "contactnumber",
            ],
            email: ["email", "emailaddress", "mail"],

            gender: ["gender", "sex"],
            organization: [
              "organization",
              "organisation",
              "org",
              "company",
              "institution",
            ],
            disabilityType: ["disability", "disabilitytype"],
            ageRange: ["age", "agerange"],
            accountNumber: ["account", "accountnumber", "accountno"],
            state: ["state"],
            lga: ["lga", "localgovernmentarea", "localgovernment", "location"],
            designation: ["designation", "role", "jobtitle", "title"],
          };

          const firstRow = splitLine(lines[0]);

          const normalizedHeaders = firstRow.map(normalizeHeader);

          const allAliases = Object.values(aliases).flat();

          const hasHeaders = normalizedHeaders.some((header) =>
            allAliases.includes(header),
          );

          let columnMap = {};
          let startIndex = 0;

          if (hasHeaders) {
            normalizedHeaders.forEach((header, index) => {
              for (const [field, names] of Object.entries(aliases)) {
                if (names.includes(header)) {
                  columnMap[field] = index;
                  break;
                }
              }
            });

            // Skip Excel header row
            startIndex = 1;
          } else {
            // Default order if there are no headers
            columnMap = {
              name: 0,
              phone: 1,
              email: 2,
              gender: 3,
              organization: 4,
              disabilityType: 5,
              ageRange: 6,
              accountNumber: 7,
            };
          }

          function getValue(parts, field) {
            const index = columnMap[field];

            if (index === undefined) {
              return "";
            }

            return String(parts[index] || "").trim();
          }

          const rows = [];

          for (let i = startIndex; i < lines.length; i++) {
            const parts = splitLine(lines[i]);

            const name = getValue(parts, "name");
            let phone = getValue(parts, "phone");

            const email = getValue(parts, "email");
            const gender = getValue(parts, "gender");
            const organization = getValue(parts, "organization");

            const disabilityType = getValue(parts, "disabilityType");

            const ageRange = getValue(parts, "ageRange");

            const accountNumber = getValue(parts, "accountNumber");

            // If Excel removed the leading 0 from a
            // Nigerian 11-digit phone number
            if (/^\d{10}$/.test(phone)) {
              phone = "0" + phone;
            }

            // Ignore completely empty rows
            if (!name && !phone) {
              continue;
            }

            const state = getValue(parts, "state");
            const lga = getValue(parts, "lga");
            const designation = getValue(parts, "designation");

            rows.push({
              name,
              phone,
              email,
              organization,
              gender,
              disabilityType,
              ageRange,
              accountNumber,
              state,
              lga,
              designation,
            });
          }

          return rows;
        }

        function parseSheetFile(file) {
          return new Promise((resolve, reject) => {
            if (!file) {
              reject(new Error("No file selected."));
              return;
            }

            if (typeof XLSX === "undefined") {
              reject(new Error("Excel reader library (XLSX) did not load."));
              return;
            }

            const fileName = String(file.name || "").toLowerCase();
            const isCsv = fileName.endsWith(".csv");
            const reader = new FileReader();

            reader.onerror = () => {
              reject(
                new Error("The browser could not read the selected file."),
              );
            };

            reader.onload = (e) => {
              try {
                let workbook;

                if (isCsv) {
                  workbook = XLSX.read(e.target.result, {
                    type: "string",
                    raw: false,
                  });
                } else {
                  workbook = XLSX.read(e.target.result, {
                    type: "array",
                    cellDates: false,
                    raw: false,
                  });
                }

                if (
                  !workbook ||
                  !workbook.SheetNames ||
                  !workbook.SheetNames.length
                ) {
                  throw new Error(
                    "No worksheet was found in the selected file.",
                  );
                }

                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                if (!sheet) {
                  throw new Error("The first worksheet could not be opened.");
                }

                const data = XLSX.utils.sheet_to_json(sheet, {
                  header: 1,
                  defval: "",
                  raw: false,
                  blankrows: false,
                });

                if (!data.length) {
                  resolve([]);
                  return;
                }

                function normalizeHeader(header) {
                  return String(header ?? "")
                    .trim()
                    .toLowerCase()
                    .replace(/&/g, "and")
                    .replace(/[\s_\-\/\\.]+/g, "")
                    .replace(/[()]/g, "");
                }

                // These are the actual columns supported by the registration form.
                // IMPORTANT: location is mapped to address, NOT LGA.
                const aliases = {
                  name: [
                    "name",
                    "fullname",
                    "attendeename",
                    "participantname",
                    "full_name",
                  ],
                  phone: [
                    "phone",
                    "phonenumber",
                    "mobile",
                    "mobilenumber",
                    "telephone",
                    "contact",
                    "contactnumber",
                    "phone_number",
                  ],
                  email: ["email", "emailaddress", "mail", "email_address"],
                  gender: ["gender", "sex"],
                  organization: [
                    "organization",
                    "organisation",
                    "org",
                    "company",
                    "institution",
                    "organisationname",
                    "organizationname",
                  ],
                  disabilityType: ["disability", "disabilitytype"],
                  ageRange: ["age", "agerange", "agegroup"],
                  accountNumber: [
                    "account",
                    "accountnumber",
                    "accountno",
                    "account_number",
                  ],
                  state: ["state", "stateofresidence"],
                  lga: [
                    "lga",
                    "localgovernmentarea",
                    "localgovernment",
                    "localgovernmentareaofresidence",
                  ],
                  designation: [
                    "designation",
                    "role",
                    "jobtitle",
                    "title",
                    "position",
                  ],
                  address: [
                    "address",
                    "location",
                    "residentialaddress",
                    "homeaddress",
                  ],
                };

                const normalizedAliasSets = Object.fromEntries(
                  Object.entries(aliases).map(([field, names]) => [
                    field,
                    new Set(names.map(normalizeHeader)),
                  ]),
                );

                // Find the header row in the first few rows. This makes the importer
                // tolerant of a title/date row above the actual Excel headers.
                let headerRowIndex = -1;
                let columnMap = {};
                const rowsToCheck = Math.min(data.length, 10);

                for (let r = 0; r < rowsToCheck; r++) {
                  const row = Array.isArray(data[r]) ? data[r] : [];
                  const candidateMap = {};

                  row.forEach((cell, index) => {
                    const header = normalizeHeader(cell);
                    if (!header) return;

                    for (const [field, names] of Object.entries(
                      normalizedAliasSets,
                    )) {
                      if (
                        names.has(header) &&
                        candidateMap[field] === undefined
                      ) {
                        candidateMap[field] = index;
                        break;
                      }
                    }
                  });

                  // Name + phone is enough to confidently identify the header row.
                  // Organization/state/designation also count as useful evidence.
                  const recognized = Object.keys(candidateMap).length;
                  if (
                    recognized >= 2 &&
                    (candidateMap.name !== undefined ||
                      candidateMap.phone !== undefined)
                  ) {
                    headerRowIndex = r;
                    columnMap = candidateMap;
                    break;
                  }
                }

                // If headers were not detected, preserve the old simple positional format.
                let startIndex;
                if (headerRowIndex >= 0) {
                  startIndex = headerRowIndex + 1;
                } else {
                  columnMap = {
                    name: 0,
                    phone: 1,
                    email: 2,
                    gender: 3,
                    organization: 4,
                    disabilityType: 5,
                    ageRange: 6,
                    accountNumber: 7,
                    state: 8,
                    lga: 9,
                    designation: 10,
                    address: 11,
                  };
                  startIndex = 0;
                }

                function getCellValue(row, field) {
                  const index = columnMap[field];
                  if (index === undefined || !row) return "";

                  const value = row[index];
                  if (value === null || value === undefined) return "";

                  return String(value).trim();
                }

                function normalizePhoneValue(value) {
                  let phone = String(value || "").trim();
                  if (!phone) return "";

                  // Remove spaces, brackets and hyphens, but keep a leading + if present.
                  phone = phone.replace(/[\s().\-]/g, "");

                  // Excel commonly converts 08036587406 to 8036587406.
                  if (/^\d{10}$/.test(phone)) {
                    phone = "0" + phone;
                  }

                  // Also handle a Nigerian number stored as +2348036587406.
                  if (/^234\d{10}$/.test(phone)) {
                    phone = "0" + phone.slice(3);
                  }

                  return phone;
                }

                const rows = [];

                for (let i = startIndex; i < data.length; i++) {
                  const row = data[i];
                  if (!Array.isArray(row)) continue;

                  const name = getCellValue(row, "name");
                  const phone = normalizePhoneValue(getCellValue(row, "phone"));

                  // Ignore completely empty rows.
                  if (!name && !phone) continue;

                  rows.push({
                    name,
                    phone,
                    email: getCellValue(row, "email"),
                    organization: getCellValue(row, "organization"),
                    gender: getCellValue(row, "gender"),
                    disabilityType: getCellValue(row, "disabilityType"),
                    ageRange: getCellValue(row, "ageRange"),
                    accountNumber: getCellValue(row, "accountNumber"),
                    state: getCellValue(row, "state"),
                    lga: getCellValue(row, "lga"),
                    designation: getCellValue(row, "designation"),
                    address: getCellValue(row, "address"),
                  });
                }

                resolve(rows);
              } catch (error) {
                reject(error);
              }
            };

            // CSV is text; Excel files are binary ArrayBuffers.
            if (isCsv) {
              reader.readAsText(file);
            } else {
              reader.readAsArrayBuffer(file);
            }
          });
        }

        function exportToExcel() {
          const rows = state.items.map((a, i) => ({
            "S/N": i + 1,
            "Full Name": a.name || "",
            "Phone Number": a.phone || "",
            "Email Address": a.email || "",
            Organization: a.organization || "",
            Gender: a.gender || "",
            "Disability Type": a.disabilityType || "",
            "Age Range": a.ageRange || "",
            State: a.state || "",
            LGA: a.lga || "",
            Designation: a.designation || "",
            Address: a.address || "",
            "Bank Name": a.bankName || "",
            "Bank Code": a.bankCode || "",
            "Account Number": a.accountNumber || "",
            "Account Name": a.accountName || "",
            "Checked In": a.checkedIn ? "Yes" : "No",
            "Checked In At": a.checkedInAt
              ? new Date(a.checkedInAt).toLocaleString()
              : "",
            "Checked Out At": a.checkedOutAt
              ? new Date(a.checkedOutAt).toLocaleString()
              : "",
            "Added At": a.addedAt ? new Date(a.addedAt).toLocaleString() : "",
          }));

          const ws = XLSX.utils.json_to_sheet(rows);

          ws["!cols"] = [
            { wch: 5 }, // S/N
            { wch: 26 }, // Full Name
            { wch: 18 }, // Phone
            { wch: 28 }, // Email
            { wch: 26 }, // Organization
            { wch: 12 }, // Gender
            { wch: 20 }, // Disability
            { wch: 14 }, // Age
            { wch: 18 }, // State
            { wch: 18 }, // LGA
            { wch: 20 }, // Designation
            { wch: 35 }, // Address
            { wch: 22 }, // Bank Name
            { wch: 14 }, // Bank Code
            { wch: 18 }, // Account Number
            { wch: 25 }, // Account Name
            { wch: 14 }, // Checked In
            { wch: 22 }, // Checked In At
            { wch: 22 }, // Checked Out At
            { wch: 22 }, // Added At
          ];

          const wb = XLSX.utils.book_new();

          XLSX.utils.book_append_sheet(wb, ws, "Attendees");

          const safeName = (state.meta.name || "attendees")
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-");

          XLSX.writeFile(wb, `${safeName}-attendees.xlsx`);
        }

              const el = document.getElementById("search-input");
              if (el) el.focus();
            });

          document.querySelectorAll(".chip").forEach((btn) => {
            btn.addEventListener("click", async () => {
              state.filter = btn.getAttribute("data-filter");
              await loadAttendees();
              render();
            });
          });

          // Check in / check out
          document.querySelectorAll("[data-toggle]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              const id = btn.getAttribute("data-toggle");
              const isCurrentlyIn = btn.getAttribute("data-current") === "1";

              if (isCurrentlyIn) {
                try {
                  const res = await apiFetch(`/staff/attendees/${id}`, {
                    method: "PATCH",
                    body: JSON.stringify({ checkedIn: false }),
                  });
                  const data = await res.json();
                  if (!res.ok) {
                    alert(data.error || "Could not check out this attendee.");
                    return;
                  }
                  await loadAttendees();
                  render();
                } catch (e) {
                  console.error(e);
                  alert("Network error — please try again.");
                }
                return;
              }

              const attendee = state.items.find((x) => x.id === id);
              if (!isProfileComplete(attendee)) {
                // Open the edit form with the attendee's existing values.
                state.modalOpen = true;
                state.editingId = id;
                state.pendingCheckInId = id;
                state.formError =
                  "Complete all required fields below before checking in.";
                state.formDraft = null;
                resetBankFormState(attendee);
                render();
                return;
              }

              // Profile is already complete: go directly to signature.
              state.signAttendeeId = id;
              state.signError = "";
              render();
            });
          });

          // Edit existing attendee. The form is populated from state.items.
          document.querySelectorAll("[data-edit]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const id = btn.getAttribute("data-edit");
              const editing = state.items.find((a) => a.id === id);
              if (!editing) return;

              state.modalOpen = true;
              state.editingId = id;
              state.pendingCheckInId = null;
              state.formError = "";
              state.formDraft = null;
              resetBankFormState(editing);
              render();
            });
          });

          // Delete attendee.
          document.querySelectorAll("[data-delete]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              const id = btn.getAttribute("data-delete");
              if (!confirm("Remove this attendee from the list?")) return;

              try {
                const res = await apiFetch(`/staff/attendees/${id}`, {
                  method: "DELETE",
                });
                const data = await res.json();
                if (!res.ok) {
                  alert(data.error || "Could not remove this attendee.");
                  return;
                }
                await loadAttendees();
                render();
              } catch (e) {
                console.error(e);
                alert("Network error — please try again.");
              }
            });
          });

          // Close edit/add modal by clicking the backdrop or Cancel.
          const overlay = document.getElementById("modal-overlay");
          if (overlay)
            overlay.addEventListener("click", (e) => {
              if (e.target === overlay) {
                state.modalOpen = false;
                state.editingId = null;
                state.pendingCheckInId = null;
                state.formDraft = null;
                state.formError = "";
                render();
              }
            });

          const cancelBtn = document.getElementById("modal-cancel");
          if (cancelBtn)
            cancelBtn.addEventListener("click", () => {
              state.modalOpen = false;
              state.editingId = null;
              state.pendingCheckInId = null;
              state.formDraft = null;
              state.formError = "";
              render();
            });

          // Keep the form state synchronized on every keystroke/change.
          // This prevents any re-render (especially bank search/verification) from
          // wiping values the user has already entered.
          const liveFormFields = [
            "f-name",
            "f-phone",
            "f-email",
            "f-org",
            "f-gender",
            "f-disability",
            "f-age",
            "f-state",
            "f-lga",
            "f-designation",
            "f-address",
          ];
          liveFormFields.forEach((id) => {
            const el = document.getElementById(id);
            if (!el) return;
            const sync = () => {
              state.formDraft = Object.assign({}, state.formDraft, {
                [id]: el.value,
              });

              // Remove the check-in warning as soon as all required fields are now complete.
              if (state.formError) {
                const current = {};
                liveFormFields.forEach((fieldId) => {
                  const fieldEl = document.getElementById(fieldId);
                  current[fieldId] = fieldEl
                    ? fieldEl.value.trim()
                    : state.formDraft[fieldId] || "";
                });
                const checkinData = {
                  name: current["f-name"],
                  phone: current["f-phone"],
                  email: current["f-email"],
                  gender: current["f-gender"],
                  ageRange: current["f-age"],
                  state: current["f-state"],
                  lga: current["f-lga"],
                  designation: current["f-designation"],
                  address: current["f-address"],
                  bankName: state.selectedBankName || "",
                  accountNumber: state.accountNumberValue || "",
                };
                if (isProfileComplete(checkinData)) state.formError = "";
              }
            };
            el.addEventListener("input", sync);
            el.addEventListener("change", sync);
          });

          // Keep all typed form values when a state change causes the form to re-render.
          const stateSelect = document.getElementById("f-state");
          if (stateSelect)
            stateSelect.addEventListener("change", (e) => {
              captureFormDraft();
              state.formDraft["f-state"] = e.target.value;
              state.formDraft["f-lga"] = "";
              render();
            });

          // Bank search.
          const bankSearchInput = document.getElementById("f-bank-search");
          if (bankSearchInput) {
            bankSearchInput.addEventListener("focus", () => {
              captureFormDraft();
              state.bankDropdownOpen = true;
              render();
              const el = document.getElementById("f-bank-search");
              if (el) {
                el.focus();
                el.selectionStart = el.selectionEnd = el.value.length;
              }
            });

            bankSearchInput.addEventListener("input", (e) => {
              captureFormDraft();
              state.bankSearchText = e.target.value;
              state.bankDropdownOpen = true;
              render();
              const el = document.getElementById("f-bank-search");
              if (el) {
                el.focus();
                el.selectionStart = el.selectionEnd = el.value.length;
              }
            });
          }

          document
            .querySelectorAll(".bank-option[data-bank-code]")
            .forEach((opt) => {
              opt.addEventListener("click", () => {
                captureFormDraft();
                state.selectedBankCode =
                  opt.getAttribute("data-bank-code") || "";
                state.selectedBankName =
                  opt.getAttribute("data-bank-name") || "";
                state.bankSearchText = state.selectedBankName;
                state.bankDropdownOpen = false;
                state.bankStatus = "";
                state.accountNameValue = "";
                if (state.formError) {
                  const editing = state.editingId
                    ? state.items.find((a) => a.id === state.editingId)
                    : null;
                  const values = state.formDraft || {};
                  const checkinData = {
                    name: values["f-name"] || (editing && editing.name) || "",
                    phone:
                      values["f-phone"] || (editing && editing.phone) || "",
                    email:
                      values["f-email"] || (editing && editing.email) || "",
                    gender:
                      values["f-gender"] || (editing && editing.gender) || "",
                    ageRange:
                      values["f-age"] || (editing && editing.ageRange) || "",
                    state:
                      values["f-state"] || (editing && editing.state) || "",
                    lga: values["f-lga"] || (editing && editing.lga) || "",
                    designation:
                      values["f-designation"] ||
                      (editing && editing.designation) ||
                      "",
                    address:
                      values["f-address"] || (editing && editing.address) || "",
                    bankName: state.selectedBankName,
                    accountNumber: state.accountNumberValue,
                  };
                  if (isProfileComplete(checkinData)) state.formError = "";
                }
                render();
                if (state.accountNumberValue.length === 10)
                  resolveBankAccount();
              });
            });

          document.addEventListener(
            "click",
            function outsideBankClick(e) {
              if (
                !e.target.closest(".bank-search-wrap") &&
                state.bankDropdownOpen
              ) {
                state.bankDropdownOpen = false;
                render();
              }
            },
            { once: true },
          );

          const accountNumberInput =
            document.getElementById("f-account-number");
          if (accountNumberInput) {
            accountNumberInput.addEventListener("input", (e) => {
              captureFormDraft();
              state.accountNumberValue = e.target.value
                .replace(/\D/g, "")
                .slice(0, 10);
              state.bankStatus = "";
              state.accountNameValue = "";

              if (
                state.accountNumberValue.length === 10 &&
                state.selectedBankCode
              ) {
                resolveBankAccount();
              } else {
                render();
                const el = document.getElementById("f-account-number");
                if (el) {
                  el.focus();
                  el.selectionStart = el.selectionEnd = el.value.length;
                }
              }
            });
          }

          // Save Add/Edit form.
          const saveBtn = document.getElementById("modal-save");
          if (saveBtn)
            saveBtn.addEventListener("click", async () => {
              const nameEl = document.getElementById("f-name");
              const phoneEl = document.getElementById("f-phone");
              const emailEl = document.getElementById("f-email");
              const orgEl = document.getElementById("f-org");
              const genderEl = document.getElementById("f-gender");
              const disabilityEl = document.getElementById("f-disability");
              const ageEl = document.getElementById("f-age");
              const stateEl = document.getElementById("f-state");
              const lgaEl = document.getElementById("f-lga");
              const designationEl = document.getElementById("f-designation");
              const addressEl = document.getElementById("f-address");

              const name = nameEl ? nameEl.value.trim() : "";
              const phone = phoneEl ? phoneEl.value.trim() : "";
              const email = emailEl ? emailEl.value.trim() : "";
              const organization = orgEl ? orgEl.value.trim() : "";
              const gender = genderEl ? genderEl.value : "";
              const disabilityType = disabilityEl ? disabilityEl.value : "";
              const ageRange = ageEl ? ageEl.value : "";
              const stateVal = stateEl ? stateEl.value : "";
              const lga = lgaEl ? lgaEl.value.trim() : "";
              const designation = designationEl
                ? designationEl.value.trim()
                : "";
              const address = addressEl ? addressEl.value.trim() : "";

              if (!name || !phone) {
                state.formError = "Name and phone number are required.";
                render();
                return;
              }

              const payload = {
                name,
                phone,
                email,
                organization,
                gender,
                disabilityType,
                ageRange,
                state: stateVal,
                lga,
                designation,
                address,
                bankName: state.selectedBankName || "",
                bankCode: state.selectedBankCode || "",
                accountNumber: state.accountNumberValue || "",
                accountName: state.accountNameValue || "",
              };

              const editingId = state.editingId;
              const pendingCheckInId = state.pendingCheckInId;
              const returnToCheckIn =
                !!pendingCheckInId && pendingCheckInId === editingId;

              // Validate everything required for check-in before saving the special Check-In edit.
              if (returnToCheckIn && !isProfileComplete(payload)) {
                const missing = missingFieldLabels(payload);
                state.formError = `Still missing: ${missing.join(", ")}`;
                state.saving = false;
                render();
                return;
              }
              if (state.accountNumberValue && state.bankStatus !== "verified") {
                state.formError =
                  "Please wait for the account number to verify, or clear it.";
                render();
                return;
              }
              state.saving = true;
              state.formError = "";
              render();

              try {
                let res;
                if (editingId) {
                  res = await apiFetch(`/staff/attendees/${editingId}`, {
                    method: "PATCH",
                    body: JSON.stringify(payload),
                  });
                } else {
                  res = await apiFetch("/staff/attendees", {
                    method: "POST",
                    body: JSON.stringify(payload),
                  });
                }

                let data = {};
                try {
                  data = await res.json();
                } catch (parseError) {
                  data = {};
                }

                if (!res.ok) {
                  state.saving = false;
                  state.formError =
                    data.error ||
                    `Could not save attendee (HTTP ${res.status}).`;
                  render();
                  return;
                }

                // Save succeeded. Update the local attendee immediately so Edit shows
                // the values that were just saved, then open signature when this came
                // from the Check-In button.
                const savedId = editingId || data.id || data._id;

                if (editingId) {
                  const index = state.items.findIndex(
                    (a) => a.id === editingId,
                  );
                  if (index !== -1) {
                    state.items[index] = {
                      ...state.items[index],
                      ...payload,
                      id: editingId,
                    };
                  }
                }

                state.saving = false;
                state.modalOpen = false;
                state.editingId = null;
                state.formDraft = null;
                state.formError = "";
                state.pendingCheckInId = null;

                if (returnToCheckIn && savedId) {
                  state.signAttendeeId = savedId;
                  state.signError = "";
                }

                // This render immediately displays the signature pad when required.
                render();

                // Refresh the list after the signature screen is already visible.
                // Do not let the refresh close/re-render the signature pad.
                loadAttendees()
                  .then(() => {
                    if (
                      !state.signAttendeeId &&
                      !state.modalOpen &&
                      !state.importOpen
                    ) {
                      render();
                    }
                  })
                  .catch((err) =>
                    console.error("Background attendee refresh failed:", err),
                  );
              } catch (e) {
                console.error("Save attendee error:", e);
                state.saving = false;
                state.formError =
                  e && e.message === "Unauthorized"
                    ? "Your session has expired. Please sign in again."
                    : "Network error — please try again.";
                render();
              }
            });

          // Import modal.
          const importOverlay = document.getElementById("import-overlay");
          if (importOverlay)
            importOverlay.addEventListener("click", (e) => {
              if (e.target === importOverlay) {
                state.importOpen = false;
                render();
              }
            });

          const importCancel = document.getElementById("import-cancel");
          if (importCancel)
            importCancel.addEventListener("click", () => {
              state.importOpen = false;
              render();
            });

          const fileDrop = document.getElementById("file-drop");
          const fileInput = document.getElementById("file-input");
          if (fileDrop && fileInput) {
            fileDrop.addEventListener("click", () => fileInput.click());
            fileInput.addEventListener("change", async () => {
              const file = fileInput.files[0];
              if (!file) return;
              try {
                const rows = await parseSheetFile(file);
                state.importRows = rows;
                state.importFileName = file.name;
                render();
              } catch (e) {
                alert(
                  "Couldn't read that file. " +
                    (e && e.message
                      ? e.message
                      : "Please choose a valid .xlsx, .xls or .csv file."),
                );
              }
            });
          }

          const importTextarea = document.getElementById("import-textarea");
          if (importTextarea)
            importTextarea.addEventListener("input", (e) => {
              state.importPastedText = e.target.value;
            });

          const importSubmit = document.getElementById("import-submit");
          if (importSubmit)
            importSubmit.addEventListener("click", async () => {
              const pastedRows = state.importPastedText
                ? parsePastedText(state.importPastedText)
                : [];
              const rows = state.importRows.length
                ? state.importRows
                : pastedRows;
              if (!rows.length) {
                alert("Choose a file or paste some rows first.");
                return;
              }

              try {
                const res = await apiFetch("/staff/attendees/import", {
                  method: "POST",
                  body: JSON.stringify({ rows }),
                });
                const summary = await res.json();
                if (!res.ok) {
                  alert(summary.error || "Import failed.");
                  return;
                }
                await loadAttendees();
                state.importSummary = {
                  ...summary,
                  skipped:
                    (summary.duplicates || 0) +
                    (summary.overCapacity || 0) +
                    (summary.invalid || 0),
                };
                state.importRows = [];
                state.importFileName = "";
                state.importPastedText = "";
              } catch (e) {
                console.error(e);
                state.importSummary = {
                  added: 0,
                  duplicates: 0,
                  overCapacity: 0,
                  invalid: rows.length,
                  skipped: rows.length,
                };
              }
              render();
            });

          // Signature modal.
          const signOverlay = document.getElementById("sign-overlay");
          if (signOverlay)
            signOverlay.addEventListener("click", (e) => {
              if (e.target === signOverlay) {
                state.signAttendeeId = null;
                state.signError = "";
                render();
              }
            });

          if (state.signAttendeeId) setupSignaturePad();
        }
        (async function init() {
          await refreshAll();
          state.loading = false;
          render();
          setInterval(async () => {
            if (
              !state.modalOpen &&
              !state.importOpen &&
              !state.signAttendeeId
            ) {
              await refreshAll();
            }
          }, 15000);
        })();
      })();
    </script>
  </body>
</html>
